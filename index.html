<meta name="mobile-web-app-capable" content="yes">

<title>Mi Granja Porcina</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: libreta de granja de bolsillo — cabecera fija con el nombre de la granja, contenido en una columna, pestañas abajo */
:root{
  --bg:#F4F2F0; --surface:#FFFFFF; --sunk:#EAE5E3; --line:#DCD4D1;
  --ink:#251C1E; --muted:#6E6265; --accent:#9C2F52; --accent-ink:#FFFFFF; --accent-soft:#F4DDE4;
  --in:#2E7A4F; --good-soft:#DDEFE3; --out:#B23A2E; --bad-soft:#F7E0DC; --warn:#8A6108; --warn-soft:#FAF0D6;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161214; --surface:#201A1C; --sunk:#110D0F; --line:#352B2E;
  --ink:#EFE7E9; --muted:#A8999D; --accent:#E57A9B; --accent-ink:#2A0B15; --accent-soft:#3D1E28;
  --in:#6BCB92; --good-soft:#17321F; --out:#F08A74; --bad-soft:#3D1F19; --warn:#E8B64A; --warn-soft:#3A2F12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161214; --surface:#201A1C; --sunk:#110D0F; --line:#352B2E;
  --ink:#EFE7E9; --muted:#A8999D; --accent:#E57A9B; --accent-ink:#2A0B15; --accent-soft:#3D1E28;
  --in:#6BCB92; --good-soft:#17321F; --out:#F08A74; --bad-soft:#3D1F19; --warn:#E8B64A; --warn-soft:#3A2F12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:block}
.brand{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-size:25px;margin:20px 0 10px;letter-spacing:-.005em;text-wrap:balance;line-height:1.15}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.in-c{color:var(--in)} .out-c{color:var(--out)} .muted{color:var(--muted)} .small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:6px 12px;font-size:13px}
.icon{border:0;background:transparent;width:38px;height:38px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon:hover{background:var(--sunk)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
@media (max-width:460px){.kpis.k4{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);padding:12px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .v.big{font-size:26px}
@media (max-width:420px){.kpi .v{font-size:14px}.kpi .v.big{font-size:22px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
button.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagno{font-family:var(--f-num);font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 7px;flex-shrink:0}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--in)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--out)}
.chip.neu{background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.sev{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:14px}
.notice b{color:var(--warn)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.stages{grid-template-columns:repeat(2,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stage .l{font-size:12px;color:var(--muted);font-weight:600}
.stage .v{font-family:var(--f-num);font-size:22px}
.stage .s{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px}
.bar .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:10px 0 6px}
.split div{height:100%}
.chart svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.pernav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pernav .lbl{font-weight:600;min-width:120px;text-align:center}
.stmt{display:grid;gap:2px;font-size:15px}
.stmt .ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.stmt .ln.sub{padding-left:14px;color:var(--muted);font-size:14px}
.stmt .ln.tot{font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.stmt .ln.fin{font-weight:700;font-size:17px;border-top:2px solid var(--ink);padding-top:10px;margin-top:6px}
.stmt .ln span:first-child{min-width:0}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:14px;margin-top:8px}
.facts div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0;min-width:0}
@media (max-width:420px){.facts{grid-template-columns:1fr}}
.timeline{display:grid;gap:0;margin-top:6px}
.timeline .ev{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.timeline .ev:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--out);color:var(--surface);font-size:10px;border-radius:9px;padding:0 5px;min-width:16px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,8,10,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-top:0}
form.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0;font-weight:400}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.f .three{grid-template-columns:1fr 1fr}}
.f .hint{font-size:13px;color:var(--muted);font-weight:400}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
.gate-logo{width:132px;height:132px;margin:28px 0 6px;display:block;filter:drop-shadow(0 6px 14px rgba(40,20,28,.18))}
@keyframes mece{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.sello-cerdo{animation:mece 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sello-cerdo{animation:none}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <svg class="logo" id="logo" viewBox="0 0 200 200" aria-hidden="true"></svg>
  <div class="brand" id="brand">Mi Granja Porcina<small>Cría y engorde</small></div>
  <button class="icon" id="gear" data-act="tab" data-k="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
</div></header>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" hidden></button>
<nav class="tabs" id="nav"><div class="in" id="tabs"></div></nav>

let pubKey=null;
function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function verificar(code){
  try{
    code=String(code||"").replace(/\s+/g,"");
    const k=code.lastIndexOf("#");if(k>=0)code=code.slice(k+1);
    const [p,s]=code.split(".");if(!p||!s)return null;
    pubKey=pubKey||await crypto.subtle.importKey("jwk",{...PUB,ext:true},{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},pubKey,b64uToBytes(s),new TextEncoder().encode(p));
    if(!ok)return null;
    const j=JSON.parse(new TextDecoder().decode(b64uToBytes(p)));
    if(!j||!/^\d{4}-\d{2}-\d{2}$/.test(j.e||""))return null;
    if(j.a!=="porcina")return null;
    return {n:j.n||"",e:j.e,i:j.i||"",code};
  }catch(e){return null}
}
function leerLic(){try{return JSON.parse(localStorage.getItem(LIC_KEY)||"null")}catch(e){return null}}
function guardarLic(l){try{localStorage.setItem(LIC_KEY,JSON.stringify(l))}catch(e){}}
function fechaRef(){const l=leerLic(),h=hoy();return l&&l.visto&&l.visto>h?l.visto:h}
function vigente(l){return !!(l&&l.e&&l.e>=fechaRef())}
function activar(p){
  const prev=leerLic()||{};
  guardarLic({n:p.n,e:p.e,i:p.i,code:p.code,visto:prev.visto&&prev.visto>hoy()?prev.visto:hoy()});
  S.lic=p;
  if(p.n&&S.cfg.granja===DEF_CFG.granja){S.cfg.granja=p.n;saveLocal()}
  S.gate=vigente(p)?"ok":"vencido";
}

const evDe=id=>Object.values(S.eventos).filter(e=>e.cerda===id).sort((a,b)=>(a.fecha+(a.creado||"")).localeCompare(b.fecha+(b.creado||"")));
function estadoCerda(c){
  let s={st:"vacia"};
  for(const e of evDe(c.id)){
    if(e.tipo==="Servicio")s={st:"servida",svc:e.fecha};
    else if(e.tipo==="Diagnóstico")s=e.resultado==="Preñada"?{...s,st:"preñada"}:{st:"vacia",desde:e.fecha};
    else if(e.tipo==="Parto")s={st:"lactando",parto:e.fecha,loteId:e.loteId};
    else if(e.tipo==="Destete")s={st:"destetada",dest:e.fecha};
    else if(e.tipo==="Aborto")s={st:"vacia",desde:e.fecha};
  }
  if(s.svc&&(s.st==="servida"||s.st==="preñada"))s.due=addD(s.svc,+S.cfg.gest||114);
  return s;
}
const ST={vacia:["Vacía","neu"],servida:["Servida","warn"],"preñada":["Preñada","ok"],lactando:["Lactando","acc"],destetada:["Destetada","neu"]};
function detalle(s){const t=hoy();
  if(s.st==="servida")return "Servida hace "+dias(s.svc,t)+" d · parto probable "+fc(s.due);
  if(s.st==="preñada")return "Día "+dias(s.svc,t)+" de gestación · parto "+fc(s.due);
  if(s.st==="lactando")return "Día "+dias(s.parto,t)+" de lactancia · destete "+fc(addD(s.parto,+S.cfg.lact||21));
  if(s.st==="destetada")return "Destetada hace "+dias(s.dest,t)+" d · esperar celo";
  return s.desde?"Vacía desde "+fc(s.desde):"Sin servicio registrado";
}
function alertas(){
  const t=hoy(),L=[];
  cerdas().forEach(c=>{const s=estadoCerda(c);
    if(s.st==="servida"){const d=dias(s.svc,t);
      if(d>=17&&d<=25)L.push({c,t:"Revisar repetición de celo",f:addD(s.svc,21)});
      if(d>=28)L.push({c,t:"Confirmar preñez",f:addD(s.svc,28)})}
    if(s.due){const r=dias(t,s.due);if(r<=10)L.push({c,t:r<0?"Parto atrasado":"Parto · pasar a maternidad",f:s.due,urg:r<=3})}
    if(s.st==="lactando"){const f=addD(s.parto,+S.cfg.lact||21);if(dias(t,f)<=4)L.push({c,t:"Destetar camada",f})}
    if(s.st==="destetada"){const d=dias(s.dest,t);if(d>=3)L.push({c,t:d>10?"Sin servicio desde el destete":"Vigilar celo post-destete",f:addD(s.dest,5),urg:d>10})}
  });
  L.forEach(a=>{a.r=dias(t,a.f);if(a.r<=0)a.urg=true});
  return L.sort((a,b)=>a.f.localeCompare(b.f));
}

}
function indicadores(){
  const desde=addD(hoy(),-365);
  const ev=Object.values(S.eventos).filter(e=>e.fecha>=desde);
  const partos=ev.filter(e=>e.tipo==="Parto"),dest=ev.filter(e=>e.tipo==="Destete");
  const vivos=partos.reduce((a,e)=>a+(+e.vivos||0),0),tot=partos.reduce((a,e)=>a+(+e.vivos||0)+(+e.muertos||0)+(+e.momias||0),0);

  const nac=dest.reduce((a,e)=>a+(+e.nacidos||0),0);

  return {partos:partos.length,pv:partos.length?vivos/partos.length:0,pt:partos.length?tot/partos.length:0,pd:dest.length?dsum/dest.length:0,
    mort:nac?Math.max(0,(1-dsum/nac)*100):null,ppa:partos.length/nc};
}

const esFijo=c=>{const g=GASTOS.find(x=>x[0]===c);return g?g[1]==="F":true};
function enPer(f,per){per=per||S.per;return per.modo==="mes"?(f||"").slice(0,7)===per.mes:(f||"").slice(0,4)===per.mes.slice(0,4)}
const perLbl=()=>S.per.modo==="mes"?mesLbl(S.per.mes):"Año "+S.per.mes.slice(0,4);

const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
function agrupar(a,k){const o={};a.forEach(x=>o[x[k]]=(o[x[k]]||0)+(+x.monto||0));return Object.entries(o).sort((x,y)=>y[1]-x[1])}
function resultado(per){
  const ing=finPer("ingreso",per),gas=finPer("gasto",per);
  const I=sum(ing,"monto"),V=sum(gas.filter(g=>!esFijo(g.cat)),"monto"),F=sum(gas.filter(g=>esFijo(g.cat)),"monto");
  return {ing,gas,I,V,F,mc:I-V,un:I-V-F};
}
function ventasPer(per){const v=Object.values(S.movs).filter(m=>m.tipo==="Venta"&&m.loteId&&enPer(m.fecha,per));return {cab:sum(v,"cabezas"),kg:sum(v,"kg"),monto:sum(v,"monto")}}

    body=`<div class="list">${L.length?L.map(l=>`<button class="item" data-act="verLote" data-id="${l.id}"><div class="main"><div class="t">${esc(l.nombre)}${l.ejemplo?' <span class="chip neu">Ejemplo</span>':""}</div><div class="s">${dias(l.inicio,hoy())} días desde ${l.etapa==="Lactancia"?"el parto":"el ingreso"}${l.peso?" · "+nf1.format(l.peso)+" kg prom.":""}</div></div><span class="chip ${l.etapa==="Engorde"?"acc":l.etapa==="Lactancia"?"ok":"neu"}">${l.etapa}</span><span class="num" style="min-width:44px;text-align:right">${l.cabezas} <span class="muted small">cab</span></span></button>`).join(""):`<div class="empty">No hay lotes. Los partos crean la camada sola; también podés registrar una compra con “+ Movimiento”.</div>`}</div>`}
  else if(S.invTab==="rep"){const R=Object.values(S.rep).filter(r=>r.estado!=="baja").sort((a,b)=>TIPOS_REP.indexOf(a.tipo)-TIPOS_REP.indexOf(b.tipo)||a.tag.localeCompare(b.tag,"es",{numeric:true}));

    body=`<div class="list">${R.length?R.map(r=>`<button class="item" data-act="${r.tipo==="Verraco"?"editRep":"verCerda"}" data-id="${r.id}"><span class="tagno">${esc(r.tag)}</span><div class="main"><div class="t">${esc(r.nombre||r.tipo)}${r.ejemplo?' <span class="chip neu">Ejemplo</span>':""}</div><div class="s">${esc(r.tipo)}${r.raza?" · "+esc(r.raza):""}${r.nac?" · "+Math.floor(dias(r.nac,hoy())/30.4)+" meses":""}</div></div></button>`).join(""):`<div class="empty">Agregá tus cerdas, primerizas y verracos con “+ Reproductor”.</div>`}</div>
    ${B.length?`<h3>Dados de baja (${B.length})</h3><div class="list">${B.map(r=>`<button class="item" data-act="editRep" data-id="${r.id}"><span class="tagno">${esc(r.tag)}</span><div class="main"><div class="t">${esc(r.nombre||r.tipo)}</div><div class="s">${esc(r.bajaMotivo||"Baja")} · ${fl(r.bajaFecha)}</div></div></button>`).join("")}</div>`:""}`}
  else{const L=Object.values(S.movs).sort((a,b)=>(b.fecha+b.creado).localeCompare(a.fecha+a.creado)).slice(0,60);

  ${body}`;
}
const MOVC={Nacimiento:"ok",Compra:"neu",Venta:"acc",Muerte:"bad",Traslado:"neu",Pesaje:"neu",Destete:"ok",Baja:"bad",Alta:"neu"};

function bars(rows,tot,color){const mx=rows.length?rows[0][1]:1;return `<div class="bars">${rows.map(([k,v])=>`<div class="bar"><span>${esc(k)}${color?` <span class="chip ${esFijo(k)?"neu":"warn"}">${esFijo(k)?"Fijo":"Variable"}</span>`:""}</span><span class="num">${M0(v)} <span class="muted small">${tot?nf1.format(v/tot*100)+"%":""}</span></span><div class="track"><div class="fill" style="width:${(v/mx*100).toFixed(1)}%"></div></div></div>`).join("")}</div>`}
function vCostos(){

  const cria=cen["Cría"]+cen.General*(cen["Cría"]/((cen["Cría"]+cen.Engorde)||1));
  const L=[...r.gas].sort((a,b)=>(b.fecha+b.creado).localeCompare(a.fecha+a.creado));
  return `<h2>Estructura de costos</h2>${perNav()}
  <div class="panel"><div class="spread"><div><div class="muted small" style="font-weight:600;letter-spacing:.06em;text-transform:uppercase">Costo total</div><div class="num" style="font-size:28px">${M0(T)}</div></div><div class="small" style="text-align:right"><span style="color:var(--warn)">●</span> Variable ${M0(r.V)}<br><span class="muted">●</span> Fijo ${M0(r.F)}</div></div>
  <div class="split"><div style="width:${T?(r.V/T*100):0}%;background:var(--warn)"></div><div style="width:${T?(r.F/T*100):0}%;background:var(--muted)"></div></div>
  <div class="muted small">${T?nf1.format(r.V/T*100)+"% variable · "+nf1.format(r.F/T*100)+"% fijo":"Sin costos en el período"}</div></div>

    <div><span>Lechones destetados</span><span class="num">${dest}</span></div>

function finRow(f){return `<button class="item" data-act="editFin" data-id="${f.id}"><div class="main"><div class="t">${esc(f.nota||f.cat)}${f.ejemplo?' <span class="chip neu">Ejemplo</span>':""}</div><div class="s">${fc(f.fecha)} · ${esc(f.cat)}${f.tipo==="gasto"?" · "+esc(f.centro||"General"):""}</div></div><span class="num ${f.tipo==="ingreso"?"in-c":"out-c"}">${f.tipo==="ingreso"?"+":"−"}${M0(f.monto)}</span></button>`}
function vResultados(){
  const r=resultado(),vt=ventasPer(),pct=r.I?r.un/r.I*100:null;
  const lines=(rows)=>rows.map(([k,v])=>`<div class="ln sub"><span>${esc(k)}</span><span class="num">${M(v)}</span></div>`).join("");
  // gráfico 6 meses
  const base=S.per.modo==="mes"?S.per.mes:S.per.mes.slice(0,4)+"-12";
  const ms=[];for(let i=5;i>=0;i--)ms.push(addMes(base,-i));
  const data=ms.map(m=>{const x=resultado({modo:"mes",mes:m});return {m,i:x.I,c:x.V+x.F,u:x.un}});
  const mx=Math.max(1,...data.map(d=>Math.max(d.i,d.c)));
  const W=340,H=160,pl=6,pb=22,top=10,cw=(W-pl*2)/6,bw=Math.min(16,cw/3),ch=H-pb-top;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y costos de los últimos seis meses">`;
  for(let k=0;k<=2;k++){const y=top+ch*k/2;svg+=`<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`}
  data.forEach((d,i)=>{const x=pl+cw*i+cw/2,h1=ch*d.i/mx,h2=ch*d.c/mx,b=H-pb,cur=enPer(d.m+"-01");
    svg+=`<rect x="${x-bw-1}" y="${b-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--in)"/><rect x="${x+1}" y="${b-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--out)"/>`;
    svg+=`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="11" fill="${cur?"var(--ink)":"var(--muted)"}" font-weight="${cur?700:400}" font-family="Barlow, sans-serif">${MESES[+d.m.slice(5)-1].slice(0,3)}</text>`});
  svg+=`<text x="${W-pl}" y="${top-1}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${M0(mx)}</text></svg>`;
  return `<h2>Estado de resultados</h2>${perNav()}
  <div class="panel"><div class="stmt">
    <div class="ln tot" style="border-top:0;padding-top:0;margin-top:0"><span>Ingresos por ventas</span><span class="num in-c">${M(r.I)}</span></div>
    ${lines(agrupar(r.ing,"cat"))}
    <div class="ln tot"><span>(−) Costos variables</span><span class="num out-c">${M(r.V)}</span></div>
    ${lines(agrupar(r.gas.filter(g=>!esFijo(g.cat)),"cat"))}
    <div class="ln tot"><span>Margen de contribución</span><span class="num">${M(r.mc)}</span></div>
    <div class="ln tot"><span>(−) Costos fijos</span><span class="num out-c">${M(r.F)}</span></div>
    ${lines(agrupar(r.gas.filter(g=>esFijo(g.cat)),"cat"))}
    <div class="ln fin"><span>Utilidad ${r.un>=0?"neta":"(pérdida)"}</span><span class="num ${r.un>=0?"in-c":"out-c"}">${M(r.un)}</span></div>
    <div class="ln sub" style="padding-left:0"><span>Margen sobre ventas</span><span class="num">${pct==null?"—":nf1.format(pct)+" %"}</span></div>
  </div></div>
  <h3>Ventas de animales</h3>
  <div class="kpis"><div class="kpi"><div class="l">Cabezas</div><div class="v">${nf0.format(vt.cab)}</div></div><div class="kpi"><div class="l">Kg vendidos</div><div class="v">${nf0.format(vt.kg)}</div></div><div class="kpi"><div class="l">Precio / kg</div><div class="v">${vt.kg?M(vt.monto/vt.kg):"—"}</div></div></div>
  <h3>Últimos 6 meses</h3>
  <div class="panel chart">${svg}<div class="row small" style="margin-top:6px"><span><span class="in-c">■</span> Ingresos</span><span><span class="out-c">■</span> Costos</span></div></div>
  <div class="spread" style="margin:22px 0 8px"><h3 style="margin:0">Ingresos del período</h3><button class="btn sm" data-act="csv">Exportar CSV</button></div>
  <div class="list">${r.ing.length?[...r.ing].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(finRow).join(""):`<div class="empty">Las ventas de animales se anotan solas desde Inventario. Otros ingresos se cargan con “+ Ingreso”.</div>`}</div>`;
}

function opts(arr,sel){return arr.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`}).join("")}
const val=(root,id)=>{const e=root.querySelector("#"+id);return e?e.value.trim():""};

/* Ficha de cerda */
function verCerda(c){

  const partos=ev.filter(e=>e.tipo==="Parto");
  const det=e=>e.tipo==="Servicio"?[e.metodo,e.verraco?"Verraco "+e.verraco:""].filter(Boolean).join(" · "):e.tipo==="Diagnóstico"?e.resultado+(e.metodo?" · "+e.metodo:""):e.tipo==="Parto"?`${e.vivos||0} vivos · ${e.muertos||0} muertos · ${e.momias||0} momias`:e.tipo==="Destete"?`${e.destetados||0} destetados${e.peso?" · "+nf1.format(e.peso)+" kg prom.":""}`:"";
  openModal(`<div class="spread"><h2 style="margin:0"><span class="tagno" style="font-size:16px">${esc(c.tag)}</span> ${esc(c.nombre||"")}</h2><span class="chip ${ST[s.st][1]}">${ST[s.st][0]}</span></div>
  <div class="muted" style="margin-top:4px">${esc(c.tipo)}${c.raza?" · "+esc(c.raza):""}${c.nac?" · nació "+fl(c.nac):""}</div>

/* Evento reproductivo */
function formEv(cid,e){
  const C=cerdas();if(!C.length&&!e){toast("Primero agregá una cerda en Inventario → Reproductores");S.tab="inventario";S.invTab="rep";render();return}
  const nuevo=!e;
  let tipoSug="Servicio";
  if(cid&&nuevo){const s=estadoCerda(S.rep[cid]);tipoSug=s.st==="servida"?"Diagnóstico":s.st==="preñada"?"Parto":s.st==="lactando"?"Destete":"Servicio"}
  e=e||{cerda:cid||C[0].id,tipo:tipoSug,fecha:hoy()};
  const V=verracos().map(v=>"#"+v.tag+(v.nombre?" "+v.nombre:""));
  const X={
    Servicio:()=>`<div class="two"><label>Método<select id="xMet">${opts(["Monta natural","Inseminación artificial"],e.metodo)}</select></label><label>Verraco o pajilla<input id="xVer" list="dlV" value="${esc(e.verraco||"")}"><datalist id="dlV">${V.map(v=>`<option value="${esc(v)}">`).join("")}</datalist></label></div>`,
    "Diagnóstico":()=>`<div class="two"><label>Resultado<select id="xRes">${opts(["Preñada","Vacía"],e.resultado)}</select></label><label>Método<select id="xMet">${opts(["Observación de celo","Ecografía","Doppler"],e.metodo)}</select></label></div>`,
    Parto:()=>`<div class="three"><label>Nacidos vivos<input id="xViv" type="number" min="0" inputmode="numeric" value="${e.vivos??""}" required></label><label>Muertos<input id="xMue" type="number" min="0" value="${e.muertos??0}"></label><label>Momias<input id="xMom" type="number" min="0" value="${e.momias??0}"></label></div>${nuevo?`<div class="hint">Se crea la camada en Inventario con los nacidos vivos.</div>`:""}`,
    Destete:()=>`<div class="two"><label>Lechones destetados<input id="xDes" type="number" min="0" inputmode="numeric" value="${e.destetados??""}" required></label><label>Peso promedio (kg)<input id="xPes" type="number" step="0.1" min="0" inputmode="decimal" value="${e.peso??""}"></label></div>${nuevo?`<div class="hint">La camada pasa a la etapa Inicio. Si murieron lechones en la lactancia, se registra la diferencia como muerte.</div>`:""}`,
    Aborto:()=>""};
  openModal(`<h2>${nuevo?"Evento de cerda":"Editar evento"}</h2>
  <form class="f" id="fEv">
    <label>Cerda<select id="eC" ${nuevo?"":"disabled"}>${opts((nuevo?C:Object.values(S.rep)).map(c=>[c.id,"#"+c.tag+(c.nombre?" "+c.nombre:"")]),e.cerda)}</select></label>
    <div class="two"><label>Evento<select id="eT" ${nuevo?"":"disabled"}>${opts(Object.keys(X),e.tipo)}</select></label><label>Fecha<input id="eF" type="date" value="${e.fecha}" required></label></div>
    <div id="xx"></div>
    <label>Notas<input id="eN" value="${esc(e.nota||"")}"></label>
    ${!nuevo&&(e.tipo==="Parto"||e.tipo==="Destete")?`<div class="hint">Editar este evento no cambia el inventario. Ajustá el lote desde Inventario si hace falta.</div>`:""}
    ${footer(!nuevo)}
  </form>`,root=>{

/* ---------- Respaldo y archivos ---------- */
async function guardarArchivo(filename,data,ok){
  try{if(!downloads)throw 0;await downloads.save({filename,data});ok&&ok();return}
  catch(e){if(e&&e.code==="declined")return}
  if(PROPIA){try{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"application/json"}));const l=document.createElement("a");l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok&&ok();return}catch(e){}}
  try{await navigator.clipboard.writeText(data);toast("No se pudo descargar aquí. Copié el contenido: pegalo en Notas.");ok&&ok()}
  catch(e){toast("No se pudo descargar ni copiar en esta vista")}
}
function leerRespaldo(txt){try{const j=JSON.parse(txt),d=j.data||j;if(!d||typeof d!=="object"||!COLS.some(c=>d[c]))throw 0;return d}catch(e){return null}}
function exportCsv(){
  const rows=[["Fecha","Tipo","Rubro","Centro","Fijo/Variable","Detalle","Monto"]];
  Object.values(S.fin).filter(f=>enPer(f.fecha)).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(f=>rows.push([f.fecha,f.tipo,f.cat,f.tipo==="gasto"?f.centro||"General":"",f.tipo==="gasto"?(esFijo(f.cat)?"Fijo":"Variable"):"",f.nota||"",f.monto]));
  const csv="﻿"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
  guardarArchivo("finanzas-"+(S.per.modo==="mes"?S.per.mes:S.per.mes.slice(0,4))+".csv",csv);
}

  const ev=(c,tipo,dd,x)=>{const o={id:uid(),cerda:c.id,tipo,fecha:d(dd),creado:T(),...E,...x};S.eventos[o.id]=o;return o};
