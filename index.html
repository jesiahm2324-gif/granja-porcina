<style>
/* Layout: libreta de granja de bolsillo — cabecera fija con el nombre de la granja, contenido en una columna, pestañas abajo */
:root{
  --bg:#F4F2F0; --surface:#FFFFFF; --sunk:#EAE5E3; --line:#DCD4D1;
  --ink:#251C1E; --muted:#6E6265; --accent:#9C2F52; --accent-ink:#FFFFFF; --accent-soft:#F4DDE4;
  --in:#2E7A4F; --good-soft:#DDEFE3; --out:#B23A2E; --bad-soft:#F7E0DC; --warn:#8A6108; --warn-soft:#FAF0D6;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161214; --surface:#201A1C; --sunk:#110D0F; --line:#352B2E;
  --ink:#EFE7E9; --muted:#A8999D; --accent:#E57A9B; --accent-ink:#2A0B15; --accent-soft:#3D1E28;
  --in:#6BCB92; --good-soft:#17321F; --out:#F08A74; --bad-soft:#3D1F19; --warn:#E8B64A; --warn-soft:#3A2F12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161214; --surface:#201A1C; --sunk:#110D0F; --line:#352B2E;
  --ink:#EFE7E9; --muted:#A8999D; --accent:#E57A9B; --accent-ink:#2A0B15; --accent-soft:#3D1E28;
  --in:#6BCB92; --good-soft:#17321F; --out:#F08A74; --bad-soft:#3D1F19; --warn:#E8B64A; --warn-soft:#3A2F12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:block}
.brand{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-size:25px;margin:20px 0 10px;letter-spacing:-.005em;text-wrap:balance;line-height:1.15}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.in-c{color:var(--in)} .out-c{color:var(--out)} .muted{color:var(--muted)} .small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:6px 12px;font-size:13px}
.icon{border:0;background:transparent;width:38px;height:38px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon:hover{background:var(--sunk)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
@media (max-width:460px){.kpis.k4{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);padding:12px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .v.big{font-size:26px}
@media (max-width:420px){.kpi .v{font-size:14px}.kpi .v.big{font-size:22px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
button.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagno{font-family:var(--f-num);font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 7px;flex-shrink:0}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--in)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--out)}
.chip.neu{background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.sev{width:4px;align-self:stretch;border-radius:2px;flex-shrink:0}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-top:14px}
.notice b{color:var(--warn)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.stages{grid-template-columns:repeat(2,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stage .l{font-size:12px;color:var(--muted);font-weight:600}
.stage .v{font-family:var(--f-num);font-size:22px}
.stage .s{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px}
.bar .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:10px 0 6px}
.split div{height:100%}
.chart svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.pernav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pernav .lbl{font-weight:600;min-width:120px;text-align:center}
.stmt{display:grid;gap:2px;font-size:15px}
.stmt .ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.stmt .ln.sub{padding-left:14px;color:var(--muted);font-size:14px}
.stmt .ln.tot{font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.stmt .ln.fin{font-weight:700;font-size:17px;border-top:2px solid var(--ink);padding-top:10px;margin-top:6px}
.stmt .ln span:first-child{min-width:0}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:14px;margin-top:8px}
.facts div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0;min-width:0}
@media (max-width:420px){.facts{grid-template-columns:1fr}}
.timeline{display:grid;gap:0;margin-top:6px}
.timeline .ev{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.timeline .ev:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--out);color:var(--surface);font-size:10px;border-radius:9px;padding:0 5px;min-width:16px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,8,10,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-top:0}
form.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0;font-weight:400}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.f .three{grid-template-columns:1fr 1fr}}
.f .hint{font-size:13px;color:var(--muted);font-weight:400}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
.gate-logo{width:132px;height:132px;margin:28px 0 6px;display:block;filter:drop-shadow(0 6px 14px rgba(40,20,28,.18))}
@keyframes mece{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.sello-cerdo{animation:mece 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sello-cerdo{animation:none}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}
.mh h2{margin:0;min-width:0}
.pdfb{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.pdfb svg,.pdfic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.pdfic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.pdfic svg{width:18px;height:18px}
.item .chev{font-size:22px;color:var(--muted)}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;overflow:hidden}
.acc .ah{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;background:transparent;border:0;text-align:left;color:var(--ink)}
.acc .ah:hover{background:var(--sunk)}
.acc .at{flex:1;min-width:0}
.acc .at b{display:block;font-size:16px;font-weight:600}
.acc .at small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .chev{font-size:24px;line-height:1;color:var(--muted);transition:transform .15s;flex-shrink:0}
.acc .ab{display:none;padding:12px 14px 14px;border-top:1px solid var(--line)}
.acc.op .ab{display:block}
.acc.op>.ah .chev{transform:rotate(90deg)}
.acc .ab>.list{border:0;border-radius:0;margin:0 -14px -14px}
.acc .ab>.list:first-child{margin-top:-12px}
.acc .ab>*+.list{border-top:1px solid var(--line);margin-top:12px}
.sheet .acc{margin-top:14px}
@media (prefers-reduced-motion:reduce){.acc .chev{transition:none}}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink)}
.addrow .btn{flex-shrink:0}
.addrow[hidden]{display:none}
.choice{display:grid;gap:10px;margin-bottom:6px}
.choice button{display:grid;gap:2px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
.choice button:hover{border-color:var(--accent)}
.choice b{font-size:16px}.choice span{font-size:13px;color:var(--muted)}
#pdfv{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 92%,#000)}
body.pv-on{overflow:hidden}
.pv-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pv-x{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;flex:none}
.pv-t{min-width:0;display:grid}.pv-t b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pv-t small{font-size:12px;color:var(--muted)}
.pv-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pv-page{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px}
.pv-page canvas{border-radius:6px;box-shadow:0 2px 0 #0002,0 10px 24px -10px #000a;background:#fff;max-width:100%}
.pv-page span{font-size:11.5px;color:var(--muted)}
.pv-bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.pv-bar .btn{flex:1;min-width:140px;padding:12px 14px;font-size:15px}

/* ===== Estilo colorido: cada módulo con su color ===== */
:root{--m-inicio:#0B8A9E;--m-cerdas:#D6336C;--m-inventario:#12A06A;--m-costos:#E8590C;--m-resultados:#3B5BDB;--m-ajustes:#7048E8;--mc:var(--m-inicio);--pig:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-inicio:#3BC4D8;--m-cerdas:#F06595;--m-inventario:#38C98D;--m-costos:#FF8A3D;--m-resultados:#6C8CFF;--m-ajustes:#9775FA}}
:root[data-theme="dark"]{--m-inicio:#3BC4D8;--m-cerdas:#F06595;--m-inventario:#38C98D;--m-costos:#FF8A3D;--m-resultados:#6C8CFF;--m-ajustes:#9775FA}
body[data-mod="cerdas"]{--mc:var(--m-cerdas)}body[data-mod="inventario"]{--mc:var(--m-inventario)}body[data-mod="costos"]{--mc:var(--m-costos)}
body[data-mod="resultados"]{--mc:var(--m-resultados)}body[data-mod="ajustes"]{--mc:var(--m-ajustes)}
body{background:radial-gradient(520px 280px at 105% -60px,color-mix(in srgb,var(--mc) 20%,transparent),transparent 70%),radial-gradient(420px 260px at -15% 35%,color-mix(in srgb,var(--mc) 9%,transparent),transparent 70%),var(--bg);transition:background-color .3s}
body::before{background:color-mix(in srgb,var(--surface) 88%,transparent)}
header.top{background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
.logo{box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 55%,transparent),0 4px 10px -4px var(--mc);border-radius:11px}
.wrap{padding-block:0 150px}
/* Tarjeta principal del módulo */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:16px;margin:16px 0 6px;color:#fff;
  background:radial-gradient(260px 170px at 100% 0,rgba(255,255,255,.30),transparent 70%),linear-gradient(140deg,color-mix(in srgb,var(--mc) 72%,#fff) 0%,var(--mc) 48%,color-mix(in srgb,var(--mc) 68%,#000) 100%);
  box-shadow:0 4px 0 color-mix(in srgb,var(--mc) 55%,#000),0 18px 34px -16px color-mix(in srgb,var(--mc) 80%,#000)}
.hero::after{content:"";position:absolute;z-index:-1;width:150px;height:150px;right:-26px;bottom:-34px;background:var(--pig) center/contain no-repeat;opacity:.20;transform:rotate(-14deg)}
.hero .mh{margin:0 0 12px;align-items:flex-start}
.hero h2{color:#fff;font-size:27px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.hsub{font-size:13px;color:rgba(255,255,255,.85);margin-top:2px}
.hero .pdfb{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .kpis{background:transparent;border:0;gap:8px;border-radius:0;overflow:visible}
.hero .kpi{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);border-radius:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.10)}
.hero .kpi .l{color:rgba(255,255,255,.85)}
.hero .kpi .v,.hero .in-c,.hero .out-c{color:#fff}
.hero .pernav{margin-bottom:12px}
.hero .seg{background:rgba(255,255,255,.18)}
.hero .seg button{color:rgba(255,255,255,.88)}
.hero .seg button.on{background:#fff;color:color-mix(in srgb,var(--mc) 85%,#000)}
.hero .icon{color:#fff}.hero .icon:hover{background:rgba(255,255,255,.18)}
.hero .pernav .lbl{color:#fff}
.hbig span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.85)}
.hbig b{display:block;font-size:32px;font-weight:500;line-height:1.15}
.hero .split{background:rgba(255,255,255,.22);height:12px}
.sv{background:#FFD43B}.sf{background:rgba(255,255,255,.8)}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:rgba(255,255,255,.92)}
.hleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* Secciones */
.acc{border-radius:18px;border-color:color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 1px 0 var(--line),0 10px 22px -16px rgba(60,20,35,.45)}
.acc .ai{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--mc) 72%,#fff),var(--mc));box-shadow:0 3px 0 color-mix(in srgb,var(--mc) 55%,#000)}
.acc .ai svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acc.op{border-color:color-mix(in srgb,var(--mc) 40%,var(--line))}
.acc.op>.ah .chev{color:var(--mc)}
/* Etapas con su color */
.stage{border:0;border-radius:14px;background:color-mix(in srgb,var(--sc,var(--mc)) 13%,var(--surface));box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--sc,var(--mc)) 30%,transparent)}
.stage .v{color:color-mix(in srgb,var(--sc,var(--mc)) 85%,var(--ink));font-weight:500}
.stage:nth-child(1){--sc:#D6336C}.stage:nth-child(2){--sc:#3B5BDB}.stage:nth-child(3){--sc:#12A06A}.stage:nth-child(4){--sc:#0B9DAD}.stage:nth-child(5){--sc:#E8590C}.stage:nth-child(6){--sc:#AE3EC9}
.kpis{border-radius:16px}
.tagno{background:color-mix(in srgb,var(--mc) 14%,var(--surface));color:color-mix(in srgb,var(--mc) 75%,var(--ink));font-weight:500}
.pdfic{background:color-mix(in srgb,var(--mc) 15%,var(--surface));color:var(--mc)}
/* Botones */
.btn{transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 80%,#fff),var(--mc));border-color:var(--mc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--mc) 55%,#000),0 8px 16px -10px var(--mc)}
.btn.pri:active{box-shadow:0 1px 0 color-mix(in srgb,var(--mc) 55%,#000)}
:focus-visible{outline-color:var(--mc)}
.fab{background:linear-gradient(145deg,color-mix(in srgb,var(--mc) 72%,#fff),var(--mc));color:#fff;bottom:calc(92px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 0 color-mix(in srgb,var(--mc) 50%,#000),0 14px 26px -10px var(--mc);transition:transform .12s,box-shadow .12s;font-weight:700}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--mc) 50%,#000)}
/* Barra de pestañas flotante */
nav.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;max-width:700px;margin:0 auto;border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 16px 34px -14px rgba(40,10,20,.5),0 2px 0 var(--line)}
nav.tabs button{border-radius:20px;padding:7px 2px 8px;transition:color .2s,background .25s}
nav.tabs button.on{color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--mc) 72%,#fff),var(--mc));box-shadow:0 6px 14px -6px var(--mc)}
nav.tabs .badge{top:2px;color:#fff;box-shadow:0 0 0 2px var(--surface)}
.toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.gate-logo{animation:none}
.sheet{border-top:4px solid var(--mc)}
@media (min-width:700px){.sheet{border-top:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 35%,transparent)}}
/* Animaciones */
@media (prefers-reduced-motion:no-preference){
  .v-in>*{animation:subir .5s cubic-bezier(.2,.8,.2,1) both}
  .v-in>*:nth-child(2){animation-delay:.06s}.v-in>*:nth-child(3){animation-delay:.12s}.v-in>*:nth-child(4){animation-delay:.17s}
  .v-in>*:nth-child(5){animation-delay:.22s}.v-in>*:nth-child(6){animation-delay:.26s}.v-in>*:nth-child(n+7){animation-delay:.3s}
  @keyframes subir{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .hero::after{animation:flotar 6s ease-in-out infinite}
  @keyframes flotar{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-8deg) translateY(-8px)}}
  .acc.op .ab{animation:abrir .25s ease-out}
  @keyframes abrir{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  nav.tabs button.on svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  nav.tabs .badge{animation:latir 1.8s ease-in-out infinite}
  @keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .fab{animation:entrarFab .45s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes entrarFab{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  .sev[style*="--out"]{animation:alerta 1.6s ease-in-out infinite}
  @keyframes alerta{0%,100%{opacity:1}50%{opacity:.35}}
  .item{transition:background .15s,transform .1s}
  .item:active{transform:scale(.99)}
  .gate-logo{animation:respirar 3.2s ease-in-out infinite}
  @keyframes respirar{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
}

body{--mcl:color-mix(in srgb,var(--mc) 72%,#fff);--mcs:var(--mc)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--mcl:color-mix(in srgb,var(--mc) 86%,#000);--mcs:color-mix(in srgb,var(--mc) 60%,#000)}}
:root[data-theme="dark"] body{--mcl:color-mix(in srgb,var(--mc) 86%,#000);--mcs:color-mix(in srgb,var(--mc) 60%,#000)}
.hero{background:radial-gradient(260px 170px at 100% 0,rgba(255,255,255,.26),transparent 70%),linear-gradient(140deg,var(--mcl) 0%,var(--mcs) 50%,color-mix(in srgb,var(--mcs) 66%,#000) 100%);box-shadow:0 4px 0 color-mix(in srgb,var(--mcs) 55%,#000),0 18px 34px -16px color-mix(in srgb,var(--mcs) 80%,#000)}
.acc .ai,nav.tabs button.on,.fab{background:linear-gradient(145deg,var(--mcl),var(--mcs))}
.btn.pri{background:linear-gradient(180deg,var(--mcl),var(--mcs));border-color:var(--mcs)}
.hero .pernav{gap:4px;flex-wrap:nowrap}
.hero .pernav .lbl{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .seg{flex-shrink:0}
</style>

const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const toS=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return toS(d)};
const dias=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);

function devId(){let d=LSG("gp_dev");if(!d||!/^[A-Z0-9]{8}$/.test(d)){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8));d=[...r].map(x=>A[x%A.length]).join("");LSG("gp_dev",d)}return d}
const devFmt=d=>d.slice(0,4)+"-"+d.slice(4);
function fechaRef(){const t=hoy(),seen=LSG("gp_seen")||"";if(seen>t)return seen;LSG("gp_seen",t);return t}
async function licCheck(code){
  try{code=String(code||"").replace(/\s+/g,"");const k=code.lastIndexOf("#");if(k>=0)code=code.slice(k+1);
    const [p,sg]=code.split(".");if(!p||!sg)return{st:"bad"};
    pubKey=pubKey||await crypto.subtle.importKey("jwk",{...PUB,ext:true},{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},pubKey,b64uToBytes(sg),new TextEncoder().encode(p)))return{st:"bad"};
    const d=JSON.parse(new TextDecoder().decode(b64uToBytes(p)));
    if(d.a!=="porcina")return{st:"bad"};
    if(d.d!==devId())return{st:"dev",n:d.n};
    const t=fechaRef();if(d.e&&t>d.e)return{st:"exp",n:d.n,e:d.e,code};
    return{st:"ok",n:d.n||"",e:d.e||"",code}}
  catch(e){return{st:"bad"}}}
function leerCode(){const c=LSG(LIC_KEY);if(!c)return null;try{const j=JSON.parse(c);return j&&j.code?j.code:null}catch(e){return c}}
async function licInit(){const c=leerCode();S.lic=c?await licCheck(c):{st:"none"};S.gate=S.lic.st==="ok"?"ok":S.lic.st==="exp"?"vencido":"sin"}

function estadoCerda(c){
  let s={st:"vacia"};
  for(const e of evDe(c.id)){
    if(e.tipo==="Servicio")s={st:"servida",svc:e.fecha};
    else if(e.tipo==="Diagnóstico")s=e.resultado==="Preñada"?{...s,st:"preñada"}:{st:"vacia",desde:e.fecha};
    else if(e.tipo==="Parto")s={st:"lactando",parto:e.fecha,loteId:e.loteId};
    else if(e.tipo==="Destete")s={st:"destetada",dest:e.fecha};
    else if(e.tipo==="Aborto")s={st:"vacia",desde:e.fecha};
  }
  if(s.svc&&(s.st==="servida"||s.st==="preñada"))s.due=addD(s.svc,+S.cfg.gest||114);
  return s;
}
const ST={vacia:["Vacía","neu"],servida:["Servida","warn"],"preñada":["Preñada","ok"],lactando:["Lactando","acc"],destetada:["Destetada","neu"]};
function detalle(s){const t=hoy();
  if(s.st==="servida")return "Servida hace "+dias(s.svc,t)+" d · parto probable "+fc(s.due);
  if(s.st==="preñada")return "Día "+dias(s.svc,t)+" de gestación · parto "+fc(s.due);
  if(s.st==="lactando")return "Día "+dias(s.parto,t)+" de lactancia · destete "+fc(addD(s.parto,+S.cfg.lact||21));

function alertas(){

      if(d>=17&&d<=25)L.push({c,t:"Revisar repetición de celo",f:addD(s.svc,21)});
      if(d>=28)L.push({c,t:"Confirmar preñez",f:addD(s.svc,28)})}
    if(s.due){const r=dias(t,s.due);if(r<=10)L.push({c,t:r<0?"Parto atrasado":"Parto · pasar a maternidad",f:s.due,urg:r<=3})}
    if(s.st==="lactando"){const f=addD(s.parto,+S.cfg.lact||21);if(dias(t,f)<=4)L.push({c,t:"Destetar camada",f})}

function datosCostos(per){
  const r=resultado(per),T=r.V+r.F,vt=ventasPer(per);
  const dest=Object.values(S.eventos).filter(e=>e.tipo==="Destete"&&enPer(e.fecha,per)).reduce((a,e)=>a+(+e.destetados||0),0);
  const cen={};CENTROS.forEach(c=>cen[c]=0);r.gas.forEach(g=>cen[g.centro||"General"]+=(+g.monto||0));
  const alim=sum(r.gas.filter(g=>g.cat==="Alimento"),"monto");
  const cria=cen["Cría"]+cen.General*(cen["Cría"]/((cen["Cría"]+cen.Engorde)||1));
  return {r,T,vt,dest,cen,alim,cria};
}

/* ---------- Razas (las más usadas en Nicaragua, según INTA) ---------- */
const RAZAS=[["Razas puras",["Landrace","Yorkshire (Large White)","Duroc","Hampshire","Pietrain","Poland China","Mangalica"]],
  ["Criollos y cruces",["Criollo (curro)","Mestizo","Landrace × Yorkshire (F1)","Duroc × Landrace","Duroc × Yorkshire","Duroc × (Landrace × Yorkshire)","Criollo × Landrace","Criollo × Yorkshire"]],
  ["Líneas genéticas",["Hypor","Topigs 40 (T40)","Topigs TRAXX"]]];
const razasBase=()=>RAZAS.reduce((a,g)=>a.concat(g[1]),[]);
const razasMias=()=>(S.cfg.razas||[]).filter(x=>!razasBase().includes(x));
function razaOpts(sel){
  const mias=razasMias().slice();
  if(sel&&sel!=="__nueva"&&!razasBase().includes(sel)&&!mias.includes(sel))mias.push(sel);
  return `<option value="">— Sin especificar —</option>`+RAZAS.map(([g,l])=>`<optgroup label="${g}">${opts(l,sel)}</optgroup>`).join("")+(mias.length?`<optgroup label="Agregadas por vos">${opts(mias,sel)}</optgroup>`:"")+`<option value="__nueva">+ Agregar nueva raza…</option>`;
}
function agregarRaza(n){n=String(n||"").trim().replace(/\s+/g," ").slice(0,40);if(!n)return null;
  const ex=razasBase().concat(razasMias()).find(x=>x.toLowerCase()===n.toLowerCase());if(ex)return ex;
  S.cfg.razas=(S.cfg.razas||[]).concat([n]);saveLocal();return n}
function razasAdmin(){const m=razasMias();
  return `<div class="muted small" style="margin-bottom:10px">La lista trae las razas, cruces y líneas genéticas más usadas en Nicaragua. Las que agregues aparecen al final, en “Agregadas por vos”.</div>
  <div class="addrow"><input id="ajRaza" maxlength="40" placeholder="Nueva raza o cruce" aria-label="Nueva raza o cruce"><button class="btn" data-act="addRaza">Agregar</button></div>
  <div class="list">${m.length?m.map(x=>`<div class="item"><div class="main"><div class="t">${esc(x)}</div></div><button class="btn sm" data-act="delRaza" data-k="${esc(x)}">Quitar</button></div>`).join(""):`<div class="empty">Todavía no agregaste razas propias.</div>`}</div>`}

/* ---------- Reportes en PDF ---------- */
const POS="#2E7A4F",NEG="#B23A2E",PMUT="#6E6265",PSOFT="#F6EEF0",PTOT="#F1E1E6";
function pdfDoc(titulo,periodo){const c=S.cfg;return PDFDoc({negocio:c.granja,tel:c.tel,dir:c.dir,prop:c.prop,logo:PDF_LOGO,logoW:240,logoH:240,titulo,periodo})}
function slug(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")}
const pctT=(x,t)=>t>0?nf1.format(x/t*100)+" %":"—";

function pdfResultados(){
  const r=resultado(),vt=ventasPer(),d=pdfDoc("Estado de resultados",perLbl());
  d.kpis([{l:"Ingresos",v:M0(r.I),vc:POS},{l:"Costos",v:M0(r.V+r.F),vc:NEG},{l:"Utilidad",v:M0(r.un),vc:r.un>=0?POS:NEG},{l:"Margen",v:pctT(r.un,r.I)}]);
  d.h1("Estado de resultados");
  d.row("Ingresos por ventas",M(r.I),{b:true,fill:PSOFT,vc:POS});
  agrupar(r.ing,"cat").forEach(([k,v])=>d.row(k,M(v),{ind:12,sz:9,lc:PMUT,v2:pctT(v,r.I)}));
  d.row("(−) Costos variables",M(r.V),{b:true,fill:PSOFT,vc:NEG});
  agrupar(r.gas.filter(g=>!esFijo(g.cat)),"cat").forEach(([k,v])=>d.row(k,M(v),{ind:12,sz:9,lc:PMUT,v2:pctT(v,r.I)}));
  d.row("Margen de contribución",M(r.mc),{b:true,line:true,v2:pctT(r.mc,r.I)});

function pdfTexto(hex){let s="";const R={};Object.entries(PDF_SPECIAL).forEach(([k,v])=>{if(v>=0x80)R[v]=k});for(let i=0;i<hex.length;i+=2){const c=parseInt(hex.substr(i,2),16);s+=R[c]||String.fromCharCode(c)}return s}
function pintarPagina(cv,ops,logoImg,ancho){
  const W=595.28,H=841.89,dpr=Math.min(3,window.devicePixelRatio||2),k=ancho/W;
  cv.width=Math.round(W*k*dpr);cv.height=Math.round(H*k*dpr);cv.style.width=ancho+"px";cv.style.height=Math.round(H*k)+"px";
  const g=cv.getContext("2d");g.setTransform(k*dpr,0,0,k*dpr,0,0);g.fillStyle="#fff";g.fillRect(0,0,W,H);
  const rgb=(r,gg,b)=>`rgb(${Math.round(r*255)},${Math.round(gg*255)},${Math.round(b*255)})`;let m;
  ops.forEach(op=>{
    if((m=op.match(/^BT \/(F[12]) ([\d.]+) Tf ([\d.]+) ([\d.]+) ([\d.]+) rg ([-\d.]+) ([-\d.]+) Td <([0-9a-f]*)> Tj ET$/))){g.font=(m[1]==="F2"?"bold ":"")+m[2]+'px Helvetica, Arial, sans-serif';g.fillStyle=rgb(+m[3],+m[4],+m[5]);g.fillText(pdfTexto(m[8]),+m[6],H-+m[7]);return}
    if((m=op.match(/^([\d.]+) ([\d.]+) ([\d.]+) rg ([-\d.]+) ([-\d.]+) ([-\d.]+) ([-\d.]+) re f$/))){g.fillStyle=rgb(+m[1],+m[2],+m[3]);g.fillRect(+m[4],H-+m[5]-+m[7],+m[6],+m[7]);return}
    if((m=op.match(/^([\d.]+) ([\d.]+) ([\d.]+) RG ([\d.]+) w ([-\d.]+) ([-\d.]+) m ([-\d.]+) ([-\d.]+) l S$/))){g.strokeStyle=rgb(+m[1],+m[2],+m[3]);g.lineWidth=+m[4];g.beginPath();g.moveTo(+m[5],H-+m[6]);g.lineTo(+m[7],H-+m[8]);g.stroke();return}
    if((m=op.match(/^q ([\d.]+) 0 0 ([\d.]+) ([-\d.]+) ([-\d.]+) cm \/Im1 Do Q$/))&&logoImg&&logoImg.complete){const sz=+m[1];g.drawImage(logoImg,+m[3],H-+m[4]-sz,sz,+m[2])}
  });
}

let PDFV=null;
function verPDF(nombre,doc){
  const bytes=doc.build(),file=new File([bytes],slug(nombre)+".pdf",{type:"application/pdf"}),pags=doc.paginas;
  cerrarPDF();
  let share=false;try{share=PROPIA&&!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  const ov=document.createElement("div");ov.id="pdfv";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");ov.setAttribute("aria-label",nombre);
  ov.innerHTML=`<div class="pv-top"><button class="pv-x" data-pv="cerrar" aria-label="Cerrar">‹ Volver</button><div class="pv-t"><b>${esc(nombre)}</b><small>${pags.length} página${pags.length===1?"":"s"} · PDF</small></div></div>
  <div class="pv-body"></div>
  <div class="pv-bar">${share?`<button class="btn" data-pv="compartir">Compartir</button>`:""}<button class="btn pri" data-pv="guardar">Guardar PDF</button></div>`;
  document.body.appendChild(ov);document.body.classList.add("pv-on");
  const body=ov.querySelector(".pv-body"),ancho=Math.min(820,(body.clientWidth||380)-24);
  let logoImg=null;const dibujar=()=>{body.innerHTML="";pags.forEach((ops,i)=>{const w=document.createElement("div");w.className="pv-page";const cv=document.createElement("canvas");cv.setAttribute("aria-label","Página "+(i+1));w.appendChild(cv);const n=document.createElement("span");n.textContent="Página "+(i+1)+" de "+pags.length;w.appendChild(n);body.appendChild(w);pintarPagina(cv,ops,logoImg,ancho)})};
  if(doc.logoSrc){logoImg=new Image();logoImg.onload=dibujar;logoImg.onerror=dibujar;logoImg.src=doc.logoSrc}else dibujar();
  PDFV={file,bytes,nombre};
  ov.addEventListener("click",async e=>{const b=e.target.closest("[data-pv]");if(!b||!PDFV)return;const a=b.dataset.pv;
    if(a==="cerrar")cerrarPDF();else if(a==="compartir")compartirPDF(PDFV.file);else if(a==="guardar")guardarPDF(PDFV.file,PDFV.bytes)});
}
function cerrarPDF(){const o=document.getElementById("pdfv");if(o)o.remove();document.body.classList.remove("pv-on");PDFV=null}
async function guardarPDF(f,bytes){
  if(!PROPIA){try{if(!downloads)throw {code:"unavailable"};await downloads.save({filename:f.name,data:bytes.slice(0)});toast("PDF guardado")}catch(e){if(e&&e.code==="declined")return;toast("No se pudo guardar el PDF en esta vista")}return}

    ${footer(!nuevo)}
  </form>`,root=>{

      if(tipo==="Destete"){o.destetados=numv(root,"xDes");o.peso=+val(root,"xPes")||0}
      if(nuevo&&tipo==="Parto"){
        if(c.tipo==="Primeriza"){c.tipo="Cerda"}
        if(o.vivos>0){const l={id:uid(),nombre:"Camada "+c.tag+" · "+fc(fecha),etapa:"Lactancia",cabezas:o.vivos,inicio:fecha,madre:c.id,peso:0,activo:true};put("lotes",l);o.loteId=l.id;
          mov({tipo:"Nacimiento",fecha,loteId:l.id,cabezas:o.vivos,nota:"Madre #"+c.tag})}
      }
      if(nuevo&&tipo==="Destete"){
        const s=estadoCerda(c),l=s.loteId&&S.lotes[s.loteId];
        if(l&&l.activo!==false){o.nacidos=+l.cabezas||0;const dif=(+l.cabezas||0)-o.destetados;
          if(dif>0)mov({tipo:"Muerte",fecha,loteId:l.id,cabezas:dif,nota:"Mortalidad en lactancia"});
          l.cabezas=o.destetados;l.etapa="Inicio";l.inicio=fecha;if(o.peso)l.peso=o.peso;l.nombre=l.nombre.replace(/^Camada/,"Destete");if(!o.destetados)l.activo=false;
          mov({tipo:"Destete",fecha,loteId:l.id,cabezas:o.destetados,etapa:"Inicio",peso:o.peso||0})}
        else{const pe=evDe(c.id).filter(x=>x.tipo==="Parto").pop();o.nacidos=pe?+pe.vivos||0:o.destetados}
      }

      const o={...r,id:r.id||uid(),tag,nombre:val(root,"rNom"),tipo:val(root,"rTipo"),raza,nac:val(root,"rNac"),ingreso:val(root,"rIng")};

  const madre=l.madre&&S.rep[l.madre];

  <div class="facts"><div><span>Cabezas</span><span class="num">${l.cabezas}</span></div><div><span>Peso promedio</span><span class="num">${l.peso?nf1.format(l.peso)+" kg":"—"}</span></div>

  ${sec("m-lmov","Movimientos del lote ("+ms.length+")",ms.length?"Último: "+esc(ms[0].tipo.toLowerCase())+" · "+fl(ms[0].fecha):"Sin movimientos",`<div class="list">${ms.length?ms.map(movRow).join(""):`<div class="empty">Sin movimientos.</div>`}</div>`)}

    Compra:()=>`<label>Lote<select id="mLote"><option value="">Nuevo lote</option>${opts(L.map(l=>[l.id,l.nombre+" ("+l.cabezas+")"]),loteId)}</select></label>

    root.querySelector("#mT").onchange=fill;
    root.querySelector("#fMov").onsubmit=ev=>{ev.preventDefault();
      const t=val(root,"mT"),fecha=val(root,"mF")||hoy();let l=S.lotes[val(root,"mLote")];

      if(t==="Compra"){
        if(!l){l={id:uid(),nombre:val(root,"mNom")||"Lote "+fc(fecha),etapa:val(root,"mEta"),cabezas:0,inicio:fecha,peso:0,activo:true};put("lotes",l)}
        const prevKg=(+l.peso||0)*(+l.cabezas||0);l.cabezas=(+l.cabezas||0)+cab;l.activo=true;if(kg)l.peso=r2((prevKg+kg)/l.cabezas);
        const m=mov({tipo:"Compra",fecha,loteId:l.id,cabezas:cab,kg,monto});
        if(monto>0)m.finId=finAdd({tipo:"gasto",fecha,cat:"Compra de animales",centro:l.etapa==="Engorde"||l.etapa==="Desarrollo"?"Engorde":"Cría",monto,nota:"Compra "+cab+" cab · "+l.nombre,movId:m.id}).id;

      if(t==="Muerte"){l.cabezas-=cab;if(!l.cabezas)l.activo=false;mov({tipo:"Muerte",fecha,loteId:l.id,cabezas:cab,nota:val(root,"mNota")});return commit("Muerte registrada")}
      if(t==="Traslado"){const e=val(root,"mEta");l.etapa=e;l.inicioEtapa=fecha;mov({tipo:"Traslado",fecha,loteId:l.id,cabezas:l.cabezas,etapa:e});return commit("Lote pasado a "+e)}

    };
  });

/* ---------- Respaldo y archivos ---------- */
async function guardarArchivo(filename,data,ok){
  try{if(!downloads)throw 0;await downloads.save({filename,data});ok&&ok();return}
  catch(e){if(e&&e.code==="declined")return}
  if(PROPIA){try{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"application/json"}));const l=document.createElement("a");l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok&&ok();return}catch(e){}}
  try{await navigator.clipboard.writeText(data);toast("No se pudo descargar aquí. Copié el contenido: pegalo en Notas.");ok&&ok()}
  catch(e){toast("No se pudo descargar ni copiar en esta vista")}
}
function leerRespaldo(txt){try{const j=JSON.parse(txt),d=j.data||j;if(!d||typeof d!=="object"||!COLS.some(c=>d[c]))throw 0;return d}catch(e){return null}}
function exportCsv(){
  const rows=[["Fecha","Tipo","Rubro","Centro","Fijo/Variable","Detalle","Monto"]];
  Object.values(S.fin).filter(f=>enPer(f.fecha)).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(f=>rows.push([f.fecha,f.tipo,f.cat,f.tipo==="gasto"?f.centro||"General":"",f.tipo==="gasto"?(esFijo(f.cat)?"Fijo":"Variable"):"",f.nota||"",f.monto]));
  const csv="﻿"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
  guardarArchivo("finanzas-"+(S.per.modo==="mes"?S.per.mes:S.per.mes.slice(0,4))+".csv",csv);
}

/* ---------- Eventos ---------- */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;

  if(a==="bg"){if(ev.target===b)closeModal();return}
  switch(a){
    case "tab":S.tab=b.dataset.k;closeModal();render();window.scrollTo(0,0);break;
    case "close":closeModal();break;
    case "invT":S.invTab=b.dataset.k;render();break;
    case "perM":S.per.modo=b.dataset.k;render();break;
    case "per":S.per.mes=addMes(S.per.mes,(+b.dataset.d)*(S.per.modo==="mes"?1:12));render();break;
    case "verCerda":verCerda(S.rep[id]);break;
    case "nuevoEv":formEv(id);break;
    case "editEv":formEv(null,S.eventos[id]);break;
    case "nuevoRep":formRep();break;
    case "editRep":formRep(S.rep[id]);break;
    case "verLote":verLote(S.lotes[id]);break;
    case "nuevoMov":formMov();break;
    case "movLote":formMov(b.dataset.t,id);break;
    case "nuevoGasto":formFin(null,"gasto");break;
    case "nuevoIng":formFin(null,"ingreso");break;
    case "editFin":formFin(S.fin[id]);break;
    case "csv":exportCsv();break;
    case "sec":toggleSec(b);break;
    case "pdf":generarPDF(b.dataset.k);break;
    case "agregarInv":agregarInv();break;
    case "addRaza":{const i=$("#ajRaza"),n=agregarRaza(i&&i.value);if(!n){toast("Escribí el nombre de la raza");break}render();toast("“"+n+"” agregada a la lista");break}
    case "delRaza":if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tocá de nuevo";break}S.cfg.razas=(S.cfg.razas||[]).filter(x=>x!==b.dataset.k);saveLocal();render();toast("Raza quitada de la lista");break;
    case "pedirCodigo":pedirCodigo();break;
    case "copiarId":copiarId();break;
    case "respaldo":{const h=hoy();guardarArchivo("respaldo-granja-"+h+".json",JSON.stringify({app:"granja-porcina",v:1,fecha:h,data:snapshot()}),()=>{S.cfg.ultimoRespaldo=h;saveLocal();render();toast("Respaldo listo")});break}
    case "borrarEj":if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tocá de nuevo para borrar";break}
      COLS.forEach(c=>Object.values(S[c]).forEach(x=>{if(x.ejemplo)delete S[c][x.id]}));Object.values(S.movs).forEach(m=>{if(m.loteId&&!S.lotes[m.loteId]||m.repId&&!S.rep[m.repId])delete S.movs[m.id]});
      saveLocal();S.tab="inicio";render();toast("Ejemplos borrados. ¡A cargar tu granja!");break;
  }
});

    saveLocal();render();toast("Ajustes guardados")}
});
